<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101728">
  <title>CPCJS — Caprice32 dans le navigateur</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">AMSTRAD CPC · WEBASSEMBLY</p>
        <h1>CPC<span>JS</span></h1>
      </div>
      <p id="status" class="status" role="status">Chargement de l’émulateur…</p>
    </header>

    <section class="machine" aria-label="Émulateur Amstrad CPC">
      <div class="screen-frame">
        <canvas id="canvas" tabindex="0" width="768" height="540" aria-label="Écran de l’Amstrad CPC"></canvas>
        <div id="screen-message" class="screen-message">
          <strong>Choisissez un jeu CPC</strong>
          <span>DSK, SNA, CDT, VOC, CPR, IPF, RAW ou ZIP</span>
        </div>
      </div>

      <div class="controls">
        <label class="file-button" for="game-file">Choisir un jeu</label>
        <input id="game-file" type="file" accept=".dsk,.sna,.cdt,.voc,.cpr,.ipf,.raw,.zip">
        <button id="start-empty" type="button">Démarrer sans jeu</button>
        <button id="fullscreen" type="button" disabled>Plein écran</button>
      </div>
    </section>

    <section class="help">
      <div><kbd>↑ ↓ ← →</kbd><span>Joystick</span></div>
      <div><kbd>Z</kbd><kbd>X</kbd><span>Feu 1 / 2</span></div>
      <div><kbd>F1</kbd><span>Menu Caprice32</span></div>
      <div><kbd>Ctrl</kbd><kbd>Entrée</kbd><span>Plein écran</span></div>
    </section>

    <details id="logs-panel">
      <summary>Journal technique</summary>
      <pre id="logs"></pre>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
